name: Release

# Tags main and publishes the GitHub release as soon as a new version lands
# there. The version is package.json's (bumped on dev by /release): nothing to
# bump, nothing to commit here.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Two quick pushes to main must not race to create the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish the release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version from package.json
        id: version
        run: |
          set -euo pipefail
          VERSION="v$(jq -r .version package.json)"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid package.json version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package.json version: ${VERSION}"

      - name: Check whether it is already released
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Any push to main without a version bump (hotfix, redeploy) keeps the
          # current version: the tag already exists, there is nothing to do.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "${VERSION} is already tagged, nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the annotated tag on the deployed commit
        if: steps.check.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
          git push origin "${VERSION}"

      - name: Publish the GitHub release
        if: steps.check.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # No hand-written release note: GitHub lists the merged PRs.
          gh release create "${VERSION}" \
            --verify-tag \
            --title "${VERSION}" \
            --generate-notes
