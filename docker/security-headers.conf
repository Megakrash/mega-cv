# Security headers of every response (copied to /etc/nginx/snippets/). nginx
# drops the server-level add_header of any location that declares its own, so
# nginx.conf includes this file at server level AND in each such location.
# `always`: 4xx/5xx responses carry them too.

# HTTPS only, for a year: one day from the 2026-11-04 launch, then a year from
# lot 7 once both hosts (apex, www) had run on HTTPS without trouble. No
# includeSubDomains (each host sends its own header, and it would bind any
# future subdomain) nor preload (only useful with it).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No framing at all (also covered by the CSP's frame-ancestors).
add_header X-Frame-Options "DENY" always;
# Features the site never uses.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

# Enforced, not Report-Only: the site is fully static and same-origin (no
# third party, no backend to collect reports). Astro is configured to emit no
# inline <style> (build.inlineStylesheets: 'never'); any inline <script> or
# style attribute added later must be hashed here or moved to a file.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
