# No nginx version in the Server header (nor on error pages).
server_tokens off;

server {
    # IPv4 only: inside the container `localhost` resolves to ::1 first, so
    # Coolify's healthcheck host is set to 127.0.0.1 (not localhost).
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik nginx only sees plain HTTP: redirects it issues itself
    # (e.g. /en → /en/) must stay relative, or they would point to http://.
    absolute_redirect off;

    # Security headers. Each location below that sets its own add_header must
    # include them again (nginx does not merge add_header levels).
    include /etc/nginx/snippets/security-headers.conf;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Long-cache fingerprinted build assets (Astro emits them under /_astro/).
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Pages (and the few unhashed files of public/) are revalidated on every
    # visit: a stale page would point to the previous build's assets, which a
    # deploy removes.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}

# www → apex: one canonical host. Declared after the main server so that one
# stays the default (a healthcheck hitting 127.0.0.1 lands there).
server {
    listen 80;
    server_name www.jonathan-scattolini.fr;
    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://jonathan-scattolini.fr$request_uri;
}
